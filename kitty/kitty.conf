# Kitty Terminal Configuration (kitty >= 0.37 for cursor_trail)
# =============================================================

# Font
# ----
# Any plain monospace font works: kitty >= 0.36 ships the Nerd Font symbols itself.
font_family         JetBrains Mono
bold_font           auto
italic_font         auto
bold_italic_font    auto
font_size           12.0

# Cursor (animated trail)
# -----------------------
cursor_shape                    beam
cursor_beam_thickness           1.5
cursor_blink_interval           0
cursor_trail                    3
cursor_trail_decay              0.1 0.4
cursor_trail_start_threshold    2

# Window
# ------
remember_window_size      yes
window_padding_width      6 10
hide_window_decorations   yes
placement_strategy        center
confirm_os_window_close   0
enable_audio_bell         no
window_alert_on_bell      yes

# Colors
# ------
include theme.conf

# Tab bar
# -------
tab_bar_edge              bottom
tab_bar_min_tabs          2
tab_bar_style             powerline
tab_powerline_style       slanted
tab_title_template        " {index}: {title} "
active_tab_font_style     bold
inactive_tab_font_style   normal

# Clipboard / shell
# -----------------
copy_on_select            yes
editor                    nvim
shell_integration         enabled
# shell: uses your login shell (zsh after `chsh -s $(which zsh)`)

# Keyboard shortcuts (kitty defaults like ctrl+shift+c/v, font size, etc. still apply)
# ------------------
map ctrl+space>c    new_tab_with_cwd
map ctrl+space>k    close_tab
map ctrl+space>n    next_tab
map ctrl+space>p    previous_tab
map ctrl+shift+t    new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd

# OS specific
# -----------
wayland_titlebar_color    background
macos_titlebar_color      background
macos_option_as_alt       yes
macos_quit_when_last_window_closed yes
